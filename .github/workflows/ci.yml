name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are cancelled, so rapid pushes never queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is ~2 min on a dev laptop but the 2-core hosted runners are
    # several times slower once the parallel-worker tests spin real pools.
    # A genuine hang is caught by pytest's faulthandler_timeout (pyproject),
    # which dumps every thread's stack — this ceiling is only a backstop.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # The shipped plugin example registers a scheduler through the
      # fleetsim.schedulers entry point; installing it here keeps the
      # out-of-tree plugin path (and example 03) under test.
      - name: Install plugin example
        run: pip install -e examples/03_custom_scheduler
      - name: Run test suite (unit + validation)
        run: pytest tests validation -q
      - name: Acceptance smoke (example scenario end to end)
        run: |
          fleetsim validate examples/01_minimal/scenario.yaml
          fleetsim run examples/01_minimal/scenario.yaml -o /tmp/ci_smoke --override outputs.plots=false
          test -f /tmp/ci_smoke/summary.json
