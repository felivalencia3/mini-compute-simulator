[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetsim"
version = "0.8.0"
description = "Discrete-event simulator for ML accelerator fleets: topology-aware gang scheduling, stochastic training/inference traffic, failures, pluggable schedulers, and a published-trace validation suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "fleetsim contributors" }]
keywords = ["simulation", "scheduling", "gpu", "tpu", "cluster", "discrete-event"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
# `validation` pulls in the parquet reader the replay harness uses to read
# jobs.parquet (pyarrow is already a core dep; the extra documents intent).
validation = ["pyarrow>=14"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
fleetsim = "fleetsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fleetsim.viz" = ["template.html"]
"fleetsim.serve" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
markers = [
    "trace_full: opt-in validation tests that download and replay a full published trace (Helios/Philly/PAI); gated behind FLEETSIM_*_FULL env vars and excluded from the default CI run for speed",
    "slow: tests that execute a large shipped example end to end (~80 s each). Run them with `pytest -m slow`; the default CI path deselects them with `-m 'not slow'`",
]
addopts = "-m 'not slow'"
# A hung test must fail LOUDLY with every thread's stack, not silently burn
# the CI job budget: pytest's built-in faulthandler dumps all tracebacks
# (main + worker threads) if a single test exceeds this many seconds.  The
# slowest legitimate test is ~10 s, so 180 s only fires on a real hang.
faulthandler_timeout = 180
