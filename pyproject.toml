[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetsim"
version = "0.5.0"
description = "Discrete-event simulator for ML accelerator fleets: topology-aware gang scheduling, stochastic training/inference traffic, failures, and pluggable schedulers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "fleetsim contributors" }]
keywords = ["simulation", "scheduling", "gpu", "tpu", "cluster", "discrete-event"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
fleetsim = "fleetsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fleetsim.viz" = ["template.html"]
"fleetsim.serve" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
